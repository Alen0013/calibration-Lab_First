[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-lab1"
version = "1.0.0"
description = "ЛР1 вариант 25: разведочный анализ данных и калибровка вероятностей"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "pydantic==2.14.4",
  "PyYAML==6.0.4",
  "mlflow-skinny==3.1.4",
]

[project.optional-dependencies]
dev = ["pre-commit==4.3.0", "ruff==0.13.3", "pytest==8.4.2", "pytest-cov==6.3.0"]
report = ["python-docx>=1.1,<2"]
video = ["playwright>=1.50,<2"]

[project.scripts]
calibration-lab = "calibration_lab.cli:main"
calibration-app = "calibration_lab.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calibration_lab = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

