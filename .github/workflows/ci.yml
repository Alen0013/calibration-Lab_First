name: LAB1 quality

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '42'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Pre-commit checks
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Separate submitted reports from fresh CI evidence
        id: prepare_evidence
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import sys
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("reports/LAB1")
          had_submitted_reports = reports.exists()
          if had_submitted_reports:
              saved = Path(tempfile.mkdtemp(prefix="lab1_submitted_reports_", dir=os.environ["RUNNER_TEMP"]))
              shutil.move(str(reports), str(saved / "LAB1"))
          reports.mkdir(parents=True, exist_ok=False)
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          provenance = {
              "kind": "independent_ci_verification",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "github_sha": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_url": run_url,
              "python_version": sys.version,
              "submitted_reports_moved_to_runner_temp": had_submitted_reports,
              "scope": (
                  "Fresh independent CI verification runs. Submitted local reports, review, "
                  "summaries and video metadata are excluded from this evidence directory. "
                  "CI run IDs and metrics describe this runner environment; equality to the "
                  "original local experiment is not asserted."
              ),
          }
          (reports / "ci_provenance.json").write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Verify original data
        run: python -m calibration_lab.cli verify --config configs/lab1.yaml
      - name: Test suite
        run: python -m pytest -q
      - name: Three actually blocked Git commits
        run: python scripts/negative_controls.py
      - name: Detect intentionally tampered raw data
        run: python -m calibration_lab.cli tamper --config configs/lab1.yaml
      - name: EDA and logged calibration demonstration
        run: python -m calibration_lab.cli eda --config configs/lab1.yaml
      - name: Repeat EDA and compare deterministic results
        run: python -m calibration_lab.cli reproduce --config configs/lab1.yaml
      - name: Preserve verification evidence
        if: ${{ always() && steps.prepare_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lab1-check-evidence
          path: |
            reports/LAB1/
            mlruns/
          retention-days: 14
          if-no-files-found: warn

