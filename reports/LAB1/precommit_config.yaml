minimum_pre_commit_version: '4.0.0'
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: secrets-and-size
        name: Staged secrets and file size
        entry: python scripts/check_staged.py
        language: system
        pass_filenames: false
        always_run: true
      - id: quick-checks
        name: Python syntax and structured file checks
        entry: python scripts/check_repo.py
        language: system
        types: [text]

